[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-one"
version = "0.1.0"
description = "AI-powered unified automation system"
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi>=0.163.2,<1.0.0",
    "uvicorn[standard]>=0.30,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.14,<0.17",
]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
